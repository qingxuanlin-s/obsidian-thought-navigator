name: Release Obsidian plugin

on:
  push:
    branches:
      - master
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Check version and existing release
        id: prepare
        run: node .github/scripts/release.mjs prepare

      - name: Install dependencies
        if: steps.prepare.outputs.should_release == 'true'
        run: npm ci

      - name: Test
        if: steps.prepare.outputs.should_release == 'true'
        run: node --test tests/*.test.cjs

      - name: Build
        if: steps.prepare.outputs.should_release == 'true'
        run: npm run build

      - name: Attest release assets
        if: steps.prepare.outputs.should_release == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # GITHUB_TOKEN 创建的 tag 不会触发新的 workflow；在同一任务中完成发布。
      - name: Create version tag and publish release
        if: steps.prepare.outputs.should_release == 'true'
        run: node .github/scripts/release.mjs publish
